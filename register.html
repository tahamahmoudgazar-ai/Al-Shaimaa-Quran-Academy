<section class="register-section">

    <h2>Book Your Free Trial Class</h2>

    <form>

        <input type="text"
               id="name"
               placeholder="Full Name"
               required>

        <select id="timezone" required>
            <option value="" selected disabled>Select Time Zone</option>
            <option>Eastern Time (ET)</option>
            <option>Central Time (CT)</option>
            <option>Mountain Time (MT)</option>
            <option>Pacific Time (PT)</option>
            <option>Greenwich Mean Time (GMT)</option>
            <option>British Time (BST)</option>
            <option>Central European Time (CET)</option>
            <option>Gulf Standard Time (GST)</option>
            <option>Arabia Standard Time (AST)</option>
            <option>Other</option>
        </select>

        <input type="text"
               id="country"
               placeholder="Country"
               required>

        <select id="course" required>

            <option value="" selected disabled>Select Course</option>

            <option>Quran Reading</option>

            <option>Quran Memorization</option>

            <option>Tajweed Course</option>

            <option>Quran Recitation</option>

            <option>Quranic Arabic</option>

            <option>Islamic Studies</option>

            <option>Separate 1-to-1 Adult Quran Coaching</option>

            <option>Kids Quran Course</option>

        </select>

        <input type="text"
               id="available"
               placeholder="Available Days & Times">

        <input type="number"
               id="age"
               placeholder="Student Age">

        <select id="studentGender">

            <option value="" selected disabled>Student Gender</option>

            <option>Male</option>

            <option>Female</option>

        </select>

        <select id="teacherGender">

            <option value="" selected disabled>Preferred Teacher Gender</option>

            <option>Male</option>

            <option>Female</option>

            <option>No Preference</option>

        </select>

        <input type="email"
               id="email"
               placeholder="Email Address"
               required>

        <input type="tel"
               id="phone"
               placeholder="WhatsApp Number"
               required>

        <textarea id="message"
                  rows="6"
                  placeholder="Write your message here..."></textarea>

        <button type="button"
                onclick="sendToWhatsApp()">
            Submit Registration
        </button>

    </form>

</section>

<footer>

    <p>© 2026 Al Shaimaa Quran Academy. All Rights Reserved.</p>

<script>

function sendToWhatsApp(){

let name = document.getElementById("name").value;
let timezone = document.getElementById("timezone").value;
let country = document.getElementById("country").value;
let course = document.getElementById("course").value;
let available = document.getElementById("available").value;
let age = document.getElementById("age").value;
let studentGender = document.getElementById("studentGender").value;
let teacherGender = document.getElementById("teacherGender").value;
let email = document.getElementById("email").value;
let phone = document.getElementById("phone").value;
let message = document.getElementById("message").value;

let text =
"📚 New Free Trial Registration\n\n" +
"Name: " + name + "\n\n" +
"Time Zone: " + timezone + "\n\n" +
"Country: " + country + "\n\n" +
"Course: " + course + "\n\n" +
"Available Times: " + available + "\n\n" +
"Student Age: " + age + "\n\n" +
"Student Gender: " + studentGender + "\n\n" +
"Preferred Teacher Gender: " + teacherGender + "\n\n" +
"Email: " + email + "\n\n" +
"WhatsApp: " + phone + "\n\n" +
"Message:\n" + message;

window.open(
"https://wa.me/201027791837?text=" + encodeURIComponent(text),
"_blank"
);

}

</script>
